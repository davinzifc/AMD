<header class="header topbar">
  <div class="topbar-left">
    <button class="menu-toggle" (click)="toggleSidebar.emit()">
      <i class="pi pi-bars"></i>
    </button>
    <div class="topbar-brand">
      <div class="brand-mark">A</div>
      <div class="brand-text">
        <span class="brand-title">AMD Tools</span>
        <span class="brand-subtitle">Certificados & Configuración</span>
      </div>
    </div>
  </div>

  <div class="topbar-search">
    <i class="pi pi-search"></i>
    <input type="text" placeholder="Buscar en el sistema..." />
  </div>

  <div class="topbar-right">
    <button class="topbar-icon" aria-label="Notificaciones">
      <i class="pi pi-bell"></i>
    </button>
    <button class="topbar-icon" aria-label="Ayuda">
      <i class="pi pi-question-circle"></i>
    </button>
    <button class="topbar-icon" aria-label="Cambiar tema" (click)="toggleTheme()">
      <i class="pi" [class.pi-sun]="isDark" [class.pi-moon]="!isDark"></i>
    </button>
    <div class="topbar-avatar">
      <span>AC</span>
    </div>
  </div>
</header>

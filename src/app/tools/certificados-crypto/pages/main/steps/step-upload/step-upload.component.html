<div class="step-content">
  <div class="section-header">
    <h3 class="section-title">Cargar archivo Excel</h3>
    <p class="section-desc">Sube el archivo con el formato NIT-nombre.xlsx</p>
  </div>
  @if (error()) {
    <p-message severity="error" [text]="error()!" styleClass="msg-block" />
  }

  <div class="upload-area">
    <app-excel-upload-zone
      [loading]="loading()"
      (fileRequest)="fileRequested.emit()" />
  </div>

  @if (empresaInfo()) {
    <div class="empresa-badge">
      <i class="pi pi-building"></i>
      <span>Empresa: <strong>{{ empresaInfo() }}</strong></span>
    </div>
  }
</div>
